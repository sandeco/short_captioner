<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captioner App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .phrase-group.highlight .input-group-text {
            background-color: var(--bs-primary);
            color: white;
            border-color: var(--bs-primary);
        }
        .phrase-group.highlight .form-control {
            background-color: #00461c;
            border-color: #00461c;
        }
    </style>
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="card p-4 shadow-lg text-center" style="width: 100%; max-width: 800px;">
            <div class="card-body">
                <div id="upload-section">
                    <h1 class="card-title mb-4">🎥 Captioner App</h1>
                    <p class="card-text text-white-50 mb-4">Passo 1: Faça o upload do seu vídeo.</p>
                    <form id="upload-form">
                        <div class="mb-3"><input class="form-control" type="file" id="video" name="video" required></div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Enviar Vídeo</button>
                    </form>
                </div>

                <div id="edit-section" class="d-none">
                    <h1 class="card-title mb-4">Edite as Legendas Sincronizadas</h1>
                    <div class="row">
                        <div class="col-lg-6 mb-3">
                            <video id="video-preview-original" controls class="w-100 rounded"></video>
                        </div>
                        <div class="col-lg-6">
                            <p class="card-text text-white-50 text-start mb-2">Clique em uma frase para pular o vídeo. Edite o texto conforme necessário.</p>
                            <div id="phrases-container" class="mb-3 text-start" style="max-height: 400px; overflow-y: auto;">
                            </div>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button id="apply-caption-btn" class="btn btn-primary w-50 py-2 mx-auto d-block">Aplicar Legendas no Vídeo</button>
                    </div>
                </div>

                <div id="result-section" class="d-none">
                    <h1 class="card-title mb-4">🎉 Sucesso!</h1>
                    <video id="video-preview-final" controls class="w-50 rounded mb-4 mx-auto"></video>
                    <a id="download-link" href="#" class="btn btn-success w-100 py-2 mb-2" download>Download</a>
                    <button onclick="resetApp()" class="btn btn-secondary w-100 py-2">Iniciar Novo Vídeo</button>
                </div>

                <div id="loading-section" class="d-none">
                    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
                    <p id="loading-text" class="mt-3"></p>
                </div>
                <div id="error-section" class="alert alert-danger d-none" role="alert"></div>
            </div>
        </div>
    </div>

    <script>
        // Elementos da UI
        const sections = {
            upload: document.getElementById('upload-section'),
            edit: document.getElementById('edit-section'),
            result: document.getElementById('result-section'),
            loading: document.getElementById('loading-section'),
            error: document.getElementById('error-section'),
        };
        const loadingText = document.getElementById('loading-text');
        const phrasesContainer = document.getElementById('phrases-container');
        
        const uploadForm = document.getElementById('upload-form');
        const applyCaptionBtn = document.getElementById('apply-caption-btn');
        
        const videoPreviewOriginal = document.getElementById('video-preview-original');
        const videoPreviewFinal = document.getElementById('video-preview-final');
        const downloadLink = document.getElementById('download-link');

        let uploadedFilename = null;
        let phrasesData = [];
        let lastHighlightedIndex = -1;

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showLoading('Enviando vídeo...');
            const formData = new FormData();
            formData.append('video', document.getElementById('video').files[0]);
            
            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message);

                uploadedFilename = data.filename;
                videoPreviewOriginal.src = data.video_url;
                
                await transcribeVideo();

            } catch (error) { showError(error.message, 'upload'); }
        });

        async function transcribeVideo() {
            showLoading('Transcrevendo... Isso pode levar um momento.');
            try {
                const response = await fetch('/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename: uploadedFilename })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message);

                phrasesData = data.phrases;
                displayEditablePhrases(phrasesData);
                switchSection('edit');
            } catch (error) {
                showError(error.message, 'upload');
            }
        }

        applyCaptionBtn.addEventListener('click', async () => {
            console.log('Botão clicado - iniciando processo de legendagem');
            showLoading('Aplicando legendas no vídeo...');
            
            console.log('uploadedFilename:', uploadedFilename);
            console.log('phrasesData:', phrasesData);
            
            const editedPhrases = phrasesData.map((phrase, index) => {
                const input = document.getElementById(`phrase-input-${index}`);
                return { ...phrase, text: input.value };
            });
            
            console.log('editedPhrases:', editedPhrases);

            try {
                console.log('Fazendo requisição para /caption...');
                const response = await fetch('/caption', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename: uploadedFilename, phrases: editedPhrases })
                });
                
                console.log('Resposta recebida:', response.status);
                const data = await response.json();
                console.log('Dados da resposta:', data);
                
                if (!response.ok) throw new Error(data.message);

                videoPreviewFinal.src = data.video_url;
                downloadLink.href = data.video_url;
                switchSection('result');
            } catch (error) { 
                console.error('Erro na requisição:', error);
                showError(error.message, 'edit'); 
            }
        });
        
        videoPreviewOriginal.addEventListener('timeupdate', () => {
            const currentTime = videoPreviewOriginal.currentTime;
            const activeIndex = phrasesData.findIndex(p => currentTime >= p.start && currentTime <= p.end);

            if (activeIndex !== lastHighlightedIndex) {
                if (lastHighlightedIndex !== -1) {
                    const oldGroup = document.getElementById(`phrase-group-${lastHighlightedIndex}`);
                    if (oldGroup) oldGroup.classList.remove('highlight');
                }

                if (activeIndex !== -1) {
                    const newGroup = document.getElementById(`phrase-group-${activeIndex}`);
                    if (newGroup) {
                        newGroup.classList.add('highlight');
                        newGroup.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
                
                lastHighlightedIndex = activeIndex;
            }
        });

        function displayEditablePhrases(phrases) {
            phrasesContainer.innerHTML = '';
            phrases.forEach((phrase, index) => {
                const formGroup = document.createElement('div');
                formGroup.className = 'input-group mb-2 phrase-group';
                formGroup.id = `phrase-group-${index}`;
                
                const timeLabel = document.createElement('span');
                timeLabel.className = 'input-group-text';
                timeLabel.textContent = `${phrase.start.toFixed(1)}s`;
                
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'form-control';
                input.value = phrase.text;
                input.id = `phrase-input-${index}`;
                
                formGroup.appendChild(timeLabel);
                formGroup.appendChild(input);

                formGroup.addEventListener('click', () => {
                    videoPreviewOriginal.currentTime = phrase.start;
                    videoPreviewOriginal.play();
                });

                phrasesContainer.appendChild(formGroup);
            });
        }

        function switchSection(sectionName) {
            Object.values(sections).forEach(s => s.classList.add('d-none'));
            if (sections[sectionName]) {
                sections[sectionName].classList.remove('d-none');
            }
        }

        function showLoading(message) {
            switchSection('loading');
            loadingText.textContent = message;
        }

        function showError(message, returnToState) {
            switchSection('error');
            sections.error.textContent = message;
            setTimeout(() => { switchSection(returnToState); }, 4000);
        }

        function resetApp() {
            switchSection('upload');
            uploadForm.reset();
            uploadedFilename = null;
            phrasesData = [];
            lastHighlightedIndex = -1;
            videoPreviewOriginal.src = '';
        }
    </script>
</body>
</html>
